<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ვეფხისტყაოსანი — სტროფული სიუჟეტური ქსელი (1–1669)</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>

  <!-- Clean Single-Row Top Bar -->
  <header class="top-bar">
    <div class="brand">
      <h1>ვეფხისტყაოსანი</h1>
      <span id="currentChapter" class="chapter-badge">სტრ. 1 / 1669</span>
      <span id="modeBadge" class="mode-badge hidden">📜 მოგონება</span>
    </div>

    <!-- Chapter Quick-Jump Dropdown -->
    <div class="chapter-select-wrap">
      <select id="chapterSelect" class="chapter-select" aria-label="თავის არჩევა"></select>
    </div>

    <!-- Compact Relationship Filters -->
    <nav class="filters" id="typeFilters" aria-label="კავშირის ფილტრი">
      <button class="filter-chip active" data-type="all">ყველა</button>
      <button class="filter-chip" data-type="love" title="მიჯნურობა / Courtly Love">💍 მიჯნურობა</button>
      <button class="filter-chip" data-type="brotherhood" title="დაძმობილება / Sworn Brotherhood">🤝 ძმობა</button>
      <button class="filter-chip" data-type="feudal" title="მეფობა და ყმობა / Fealty">👑 მეფობა</button>
      <button class="filter-chip" data-type="service" title="ერთგულება და მსახურება / Loyal Service">🛡️ მსახურება</button>
      <button class="filter-chip" data-type="letter" title="წერილი / Epistle">💌 წერილი</button>
      <button class="filter-chip" data-type="conflict" title="ბრძოლა / Conflict">⚔️ ბრძოლა</button>
      <button class="filter-chip" data-type="rescue" title="დახსნა / Rescue">🔓 დახსნა</button>
      <button class="filter-chip" data-type="grief_support" title="თანაგრძნობა / Shared Mourning">💧 თანაგრძნობა</button>
    </nav>

    <!-- Right Controls: Search, Granularity (1669 Stanzas | 65 Chapters), Language, Monograph -->
    <div class="top-controls">
      <div class="search-wrapper">
        <input
          type="search"
          id="globalSearchInput"
          class="search-input"
          placeholder="🔍 სტროფი # ან სიტყვა..."
          autocomplete="off"
        />
        <div id="searchDropdown" class="search-dropdown hidden"></div>
      </div>

      <div class="segmented-control" id="granularityToggle" title="სტროფული ან თავების რეჟიმი">
        <button class="seg-btn active" data-granularity="stanzas">1669 სტროფი</button>
        <button class="seg-btn" data-granularity="chapters">65 თავი</button>
      </div>

      <div class="segmented-control" id="langToggle" title="ენა / Language">
        <button class="seg-btn active" data-lang="ka">KA</button>
        <button class="seg-btn" data-lang="en">EN</button>
        <button class="seg-btn" data-lang="bi">KA+EN</button>
      </div>

      <button class="icon-btn" id="openMonographBtn" title="სამეცნიერო მონოგრაფია და წყაროები / Scholarly Monograph">
        📜
      </button>
    </div>
  </header>

  <!-- Interactive Stanza Scrubber Bar (1–1669) -->
  <div class="timeline-scrubber">
    <button class="step-nav-btn" id="prevStepBtn" title="წინა სტროფი / Previous">◀</button>
    <input
      type="range"
      id="stanzaSlider"
      class="stanza-slider"
      min="0"
      max="1668"
      value="0"
      aria-label="სტროფის სკრაბერი"
    />
    <button class="step-nav-btn" id="nextStepBtn" title="შემდეგი სტროფი / Next">▶</button>
  </div>

  <!-- Main Split Layout: Stanza Scroller + Sticky Swimlane Realm Graph -->
  <main class="app-container">
    <section class="scroller" id="scroller"></section>
    <section class="stage" id="stageContainer">
      <svg id="stageSvg"></svg>
    </section>
  </main>

  <!-- Focused Inspector Drawer -->
  <aside id="inspector" class="inspector">
    <div class="inspector-header">
      <h3 id="inspectorTitle" class="inspector-title">ინსპექტორი</h3>
      <button class="close-btn" id="closeInspectorBtn" aria-label="Close">×</button>
    </div>
    <div id="inspectorBody" class="inspector-content"></div>
  </aside>

  <!-- Scholarly Monograph Modal -->
  <div id="monographModal" class="modal-overlay hidden">
    <div class="modal-card">
      <div class="modal-header">
        <div>
          <h2 id="monographTitle">📜 სამეცნიერო მონოგრაფია და წყაროები</h2>
          <div class="modal-subtitle">1966 აკადემიური გამოცემა (1,669 სტროფი) • მ. უორდროპის თარგმანი (1,576 სტროფი)</div>
        </div>
        <button class="close-btn" id="closeMonographBtn" aria-label="Close">×</button>
      </div>
      <div id="monographBody" class="modal-body"></div>
    </div>
  </div>

  <script src="data/poem-bundle.js"></script>
  <script src="data/story-graph-bundle.js"></script>
  <script src="app.js"></script>
</body>
</html>
